services:

  oracle-db:
    image: gvenzl/oracle-free:23-slim
    container_name: oracle-free-db

    environment:
      ORACLE_PASSWORD: oracle123
      APP_USER: appuser
      APP_USER_PASSWORD: apppassword

    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    volumes:
      - oracle_data:/opt/oracle/oradata


  api:
    build: .
    image: rimaaltarshi/healthcheckapp:1.0.0
    container_name: healthcheckapp

    ports:
      - "8081:8081"

    environment:
      DB_URL: jdbc:oracle:thin:@oracle-db:1521/FREEPDB1
      DB_USERNAME: appuser
      DB_PASSWORD: apppassword

    volumes:
      - ./shared_upload_files:/app/uploaded_files

    depends_on:
      oracle-db:
        condition: service_healthy

    restart: always


volumes:
  oracle_data: