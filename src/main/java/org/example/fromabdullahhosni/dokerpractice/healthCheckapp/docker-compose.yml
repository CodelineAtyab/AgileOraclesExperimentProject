services:

  oracledb:
    image: gvenzl/oracle-free:23-slim
    restart: always
    shm_size: 1gb
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}
      APP_USER: ${APP_USER}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD}
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s

  checkhealthyapi:
    build: .
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - myappStorage:/app/uploaded_files
    depends_on:
      oracledb:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@oracledb:1521/FREEPDB1
      SPRING_DATASOURCE_USERNAME: ${APP_USER}
      SPRING_DATASOURCE_PASSWORD: ${APP_USER_PASSWORD}

volumes:
  myappStorage:
