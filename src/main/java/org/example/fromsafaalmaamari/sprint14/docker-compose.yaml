services:
  oracle-db:
    image: gvenzl/oracle-free:23-slim
    container_name: oracle-db

    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}
      APP_USER: ${APP_USER}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD}

    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    restart: always

  api:
    build: .
    image: safa/healthcheck-app:1.0.0
    container_name: healthcheck-container

    ports:
      - "8000:8080"

    volumes:
      - ./shared_upload_files:/app/uploaded_files

    depends_on:
      oracle-db:
        condition: service_healthy

    restart: always