services:
  api:
    build: .
    image: healthcheck-app
    container_name: healthcheck-container
    ports:
      - "8000:8080"
    environment:
      DB_URL: jdbc:oracle:thin:@oracle-db:1521/FREEPDB1
      DB_USERNAME: ${APP_USER}
      DB_PASSWORD: ${APP_USER_PASSWORD}
    volumes:
      - ./shared_upload_files:/app/uploaded_files # Bind Mount
    depends_on:
      oracle-db:
        condition: service_healthy
    restart: always

  oracle-db:
    image: gvenzl/oracle-free:23-slim
    container_name: oracle-free-db
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}
      APP_USER: ${APP_USER}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD}
    healthcheck:
      test: [ "CMD", "healthcheck.sh" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - oracle-data:/opt/oracle/oradata
    restart: always

volumes:
  oracle-data: