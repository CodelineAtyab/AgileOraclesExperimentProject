services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: oracle-free
    environment:
      ORACLE_PASSWORD: SysPass123
      APP_USER: appuser
      APP_USER_PASSWORD: AppUserPass123
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./healthcheck/init:/container-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    # Final: no ports. Uncomment only while testing with DB Visualizer:
    # ports:
    #   - "1521:1521"

  api:
    build: ./healthcheck
    container_name: upload-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@oracle:1521/FREEPDB1
      SPRING_DATASOURCE_USERNAME: appuser
      SPRING_DATASOURCE_PASSWORD: AppUserPass123
    volumes:
      - ./shared_upload_files:/app/uploaded_files
    depends_on:
      oracle:
        condition: service_healthy

volumes:
  oracle-data:
