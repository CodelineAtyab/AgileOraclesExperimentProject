services:
  oracle-db:
    image: gvenzl/oracle-free:23-slim
    container_name: healthcheck-oracle
    environment:
      ORACLE_PASSWORD: OracleAdmin123
      APP_USER: healthcheck
      APP_USER_PASSWORD: Healthcheck123
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    volumes:
      - oracle_data:/opt/oracle/oradata
    restart: always

  api:
    build: .
    image: healthcheck-app:2.0.0
    container_name: healthcheck-api
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:oracle:thin:@oracle-db:1521/FREEPDB1
      DB_USERNAME: healthcheck
      DB_PASSWORD: Healthcheck123
    volumes:
      - ./shared_upload_files:/app/uploaded_files
    depends_on:
      oracle-db:
        condition: service_healthy
    restart: always

volumes:
  oracle_data:
