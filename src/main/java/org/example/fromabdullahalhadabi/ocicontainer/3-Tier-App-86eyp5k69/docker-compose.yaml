services:
  db:
    image: gvenzl/oracle-free:23-slim
    container_name: oracle-db
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-ChangeMe123}
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  api:
    build: .
    image: healthcheck-app
    container_name: healthcheck-container
    ports:
      - "8000:8080"
    volumes:
      - ./shared_upload_files:/app/uploaded_files
    environment:
      DB_URL: jdbc:oracle:thin:@db:1521/FREEPDB1
      DB_USERNAME: SYSTEM
      DB_PASSWORD: ${ORACLE_PASSWORD:-ChangeMe123}
      DB_DRIVER: oracle.jdbc.OracleDriver
      JPA_DDL_AUTO: update
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  oracle-data:
