services:

  oracle-db:
    image: gvenzl/oracle-free:23-slim
    container_name: oracle-free
    environment:
      ORACLE_PASSWORD: oracle123
      APP_USER: healthapp
      APP_USER_PASSWORD: healthapp123
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: always

  api:
    build: .
    image: safalsibani/health-app:1.0.0
    container_name: health-app
    ports:
      - "8000:8080"
    volumes:
      - ./shared_upload_files:/app/uploaded_files
    depends_on:
      oracle-db:
        condition: service_healthy
    restart: always

volumes:
  oracle-data: